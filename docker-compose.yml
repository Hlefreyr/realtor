services:
  mongo:
    image: mongo:7
    container_name: realtor-mongo
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db
    networks:
      - realtor-network
    mem_limit: 1536m
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  mongo-express:
    image: mongo-express:latest
    container_name: realtor-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - realtor-network
    mem_limit: 384m
    mem_reservation: 128m
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  realtor:
    build:
      context: ./realtor
      dockerfile: Dockerfile.dev
    container_name: realtor-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/realtor
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=768
    volumes:
      - ./realtor:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - realtor-network
    mem_limit: 1024m
    mem_reservation: 384m
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M

  realtor-ui:
    build:
      context: ./realtor-ui
      dockerfile: Dockerfile.dev
    container_name: realtor-frontend
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      - EXPO_PUBLIC_GRAPHQL_URI=http://localhost:4000/graphql
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyA9edVAq_sH2WYqwQeGBJw3vp58X7tAUQg
      - CI=false
      - EXPO_OFFLINE=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max-old-space-size=1280
    volumes:
      - ./realtor-ui:/app
      - /app/node_modules
      - /app/.expo
    depends_on:
      - realtor
    networks:
      - realtor-network
    mem_limit: 1536m
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

volumes:
  mongo_data:

networks:
  realtor-network:
    driver: bridge
