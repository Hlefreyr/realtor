services:
  mongo:
    image: mongo:7
    container_name: realtor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_data:/data/db
    networks:
      - realtor-network

  mongo-express:
    image: mongo-express:latest
    container_name: realtor-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - realtor-network

  realtor:
    build:
      context: ./realtor
      dockerfile: Dockerfile
    container_name: realtor-backend-dev
    restart: unless-stopped
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/realtor
      - NODE_ENV=development
    volumes:
      - ./realtor/src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - realtor-network

  realtor-ui:
    build:
      context: ./realtor-ui
      dockerfile: Dockerfile.dev
    container_name: realtor-frontend-dev
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      - EXPO_PUBLIC_GRAPHQL_URI=http://localhost:4000/graphql
      - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyA9edVAq_sH2WYqwQeGBJw3vp58X7tAUQg
      - NODE_ENV=development
    volumes:
      - ./realtor-ui/src:/app/src
    depends_on:
      - realtor
    networks:
      - realtor-network

volumes:
  mongo_data:

networks:
  realtor-network:
    driver: bridge
