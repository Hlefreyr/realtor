version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: realtor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - realtor-network

  realtor:
    build:
      context: ./realtor
      dockerfile: Dockerfile
    container_name: realtor-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/realtor
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - realtor-network

  realtor-ui:
    build:
      context: ./realtor-ui
      dockerfile: Dockerfile
    container_name: realtor-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - EXPO_PUBLIC_GRAPHQL_URI=http://localhost:4000/graphql
    depends_on:
      - realtor
    networks:
      - realtor-network

volumes:
  mongo_data:

networks:
  realtor-network:
    driver: bridge
